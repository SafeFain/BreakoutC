name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            build_config: ""
            exe: ./build/neon-breaker
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix)
            build_config: ""
            exe: ./build/neon-breaker
          - name: Windows
            os: windows-latest
            cmake_args: ""   # Windows uses a dedicated configure step (pwsh + vcpkg toolchain)
            build_config: --config Release
            exe: ./build/Release/neon-breaker.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Build tools (preinstalled on GitHub runners; installed explicitly for act images)
          sudo apt-get install -y cmake g++
          # Runtime libraries for the vendored SDL3 3.2.10 (ubuntu-24.04 package names)
          sudo apt-get install -y \
            libasound2t64 libx11-6 libxext6 libxcursor1 libxi6 libxfixes3 \
            libxrandr2 libxss1 libpipewire-0.3-0 libpulse0 libsndio7.0 \
            libdrm2 libgbm1 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            libxkbcommon0 libdecor-0-0 libharfbuzz0b libfreetype6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true   # Preinstalled tap triggers trust warnings; unrelated to this build
          brew install sdl3 sdl3_ttf

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build ${{ matrix.cmake_args }}

      - name: Build (zero warnings)
        run: cmake --build build -j ${{ matrix.build_config }}

      - name: Print version
        run: ${{ matrix.exe }} --version

      - name: Self-test --aim-test (sticky launch direction)
        run: ${{ matrix.exe }} --aim-test

      - name: Headless smoke test (screenshot regression)
        env:
          SDL_VIDEODRIVER: dummy
        run: ${{ matrix.exe }} --level 3 --auto --screenshot ci-smoke.bmp

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.name }}
          path: ci-smoke.bmp
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make g++ unzip

      - name: Cache cross-compile dependencies (NDK + SDL sources)
        uses: actions/cache@v5
        continue-on-error: true   # Fall back to a fresh download when the cache is unavailable
        with:
          path: tools/android
          key: android-deps-ndk-r27c-sdl-3.2.10-${{ runner.os }}

      - name: Fetch dependencies (NDK ~660 MB + SDL3 sources)
        run: tools/android/fetch-deps.sh

      - name: Cross-compile libmain.so (zero warnings)
        run: tools/android/build-android.sh

      - name: Verify libmain.so
        run: file build-android/libmain.so

      - name: Upload libmain.so
        uses: actions/upload-artifact@v6
        with:
          name: libmain.so
          path: build-android/libmain.so
          if-no-files-found: error

      - name: Prepare JDK and Android SDK
        run: |
          # JDK (preinstalled on runners; installed explicitly for act images)
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          # SDK: use the preinstalled copy when available, otherwise download cmdline-tools
          if [ -z "${ANDROID_SDK_ROOT:-}" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -sL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          fi
          # Add sdkmanager to PATH for both the preinstalled and the downloaded layouts
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" --sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" >/dev/null 2>&1 || true

      - name: Assemble debug APK
        run: |
          mkdir -p android-project/app/libs/arm64-v8a
          cp build-android/libmain.so android-project/app/libs/arm64-v8a/
          cd android-project && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: neon-breaker-debug.apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch SDL3 sources (no NDK)
        run: tools/android/fetch-deps.sh --no-ndk

      - name: Configure (CMake iOS simulator cross-compilation)
        run: cmake -G Xcode -B build-ios -DCMAKE_SYSTEM_NAME=iOS \
             -DCMAKE_OSX_SYSROOT=iphonesimulator \
             -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (zero warnings)
        run: cmake --build build-ios --config Release -- -sdk iphonesimulator

      - name: Verify artifact
        run: |
          APP=$(find build-ios -path "*Release-iphonesimulator/neon-breaker.app" -type d | head -1)
          echo "app bundle: $APP"
          file "$APP/neon-breaker"
          test -f "$APP/Info.plist" && echo "Info.plist OK"
